// ============================================================================
// SimpleGroup — model.cfg
// Definicion de esqueleto y animaciones para banderas de territorio
//
// Animacion flag_mast: traslacion vertical de la tela/bandera
//   phase 0 = bandera arriba (raised)  — convencion vanilla
//   phase 1 = bandera abajo (lowered)  — convencion vanilla
//
// Requiere en cada .p3d:
//   - Named selection "flag_mast" en LODs visuales (la geometria de la tela)
//   - Memory LOD: 2 puntos "flag_mast_axis" (eje vertical de traslacion)
// ============================================================================

class CfgSkeletons
{
    class Skeleton_Flagpole
    {
        isDiscrete = 1;
        skeletonInherit = "";
        skeletonBones[] =
        {
            "flag_mast", ""
        };
    };
};

class CfgModels
{
    class Default
    {
        sections[] = {};
        skeletonName = "";
    };

    class T1_Flagpole: Default
    {
        skeletonName = "Skeleton_Flagpole";
        sections[] = {"flag_mast"};

        class Animations
        {
            class flag_mast
            {
                type = "translation";
                source = "flag_mast";
                selection = "flag_mast";
                axis = "flag_mast_axis";
                memory = 1;
                minValue = 0;
                maxValue = 1;
                offset0 = 0;
                offset1 = 1;
            };
        };
    };

    class T1_FlagKit: Default {};
    class T2_Flagpole: T1_Flagpole {};
    class T3_Flagpole: T1_Flagpole {};
};
